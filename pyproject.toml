[project]
name = "m4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "reem mohamed", email = "reemesa2021@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.4",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "openai>=3.26.0",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
m4 = "m4:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
